<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>UnikPlayer Custom Example</title>
        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            body {
                /* Font set automatically by UnikPlayer via postMessage */
                font-family: "Rubik", sans-serif;
                background: transparent;
            }

            /* ========================================
       PLAYER LAYOUT
       ======================================== */
            .player {
                display: flex;
                align-items: center;
                gap: 0.6rem;
                padding: 0.5rem;
                background: var(--darkMuted);
                border: 2px solid var(--vibrant);
                border-radius: 0.5rem;
                width: 22rem;
            }

            /* ========================================
       THUMBNAIL
       Use {{thumbnail}} — replaced once on track load
       ======================================== */
            .thumbnail {
                width: 3.5rem;
                height: 3.5rem;
                border-radius: 0.35rem;
                object-fit: cover;
                border: 2px solid var(--lightMuted);
                flex-shrink: 0;
                /* CSS animation — will NOT break on progress updates */
                transition: border-color 0.5s ease;
            }

            .thumbnail:hover {
                border-color: var(--vibrant);
            }

            /* ========================================
       INFO SECTION
       ======================================== */
            .info {
                flex: 1;
                min-width: 0;
                display: flex;
                flex-direction: column;
                gap: 0.15rem;
            }

            /* ========================================
       TITLE & ARTIST
       Use {{title}} and {{artist}} — replaced once on track load
       ======================================== */
            .title {
                font-size: 1rem;
                font-weight: 600;
                color: var(--lightVibrant);
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }

            .artist {
                font-size: 0.75rem;
                color: var(--lightVibrant);
                opacity: 0.6;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }

            /* ========================================
       PROGRESS BAR
       Uses data-bind="progress-width" — updated live via postMessage
       CSS transition makes it smooth!
       ======================================== */
            .progress-container {
                display: flex;
                align-items: center;
                gap: 0.4rem;
                margin-top: 0.2rem;
            }

            .time {
                font-size: 0.6rem;
                color: var(--lightVibrant);
                opacity: 0.5;
                min-width: 2rem;
            }

            .time.total {
                text-align: right;
            }

            .progress-bar {
                flex: 1;
                height: 3px;
                background: rgba(255, 255, 255, 0.1);
                border-radius: 2px;
                overflow: hidden;
            }

            .progress-fill {
                height: 100%;
                width: 0%;
                background: linear-gradient(
                    90deg,
                    var(--vibrant),
                    var(--lightVibrant)
                );
                border-radius: 2px;
                /* Smooth transition — works because iframe is NOT recreated on progress updates */
                transition: width 0.5s linear;
            }
        </style>
    </head>
    <body>
        <div class="player">
            <!-- Thumbnail: {{thumbnail}} is replaced once when track changes -->
            <img class="thumbnail" src="{{thumbnail}}" alt="" />

            <div class="info">
                <!-- Title & Artist: {{title}}, {{artist}} replaced once when track changes -->
                <div class="title">{{title}}</div>
                <div class="artist">{{artist}}</div>

                <!-- Progress bar: data-bind updates live via postMessage, no iframe reload -->
                <div class="progress-container">
                    <!-- data-bind="currentTime" — updates text to "2:05" format -->
                    <span class="time" data-bind="currentTime">0:00</span>

                    <div class="progress-bar">
                        <!-- data-bind="progress-width" — updates style.width to progress% -->
                        <div
                            class="progress-fill"
                            data-bind="progress-width"
                        ></div>
                    </div>

                    <!-- data-bind="totalTime" — updates text to "4:40" format -->
                    <span class="time total" data-bind="totalTime">0:00</span>
                </div>
            </div>
        </div>

        <!--
  ╔══════════════════════════════════════════════╗
  ║  UnikPlayer Custom Player Template Guide     ║
  ╠══════════════════════════════════════════════╣
  ║                                              ║
  ║  TRACK DATA (replaced once per track):       ║
  ║    {{title}}     — song title                ║
  ║    {{artist}}    — artist name               ║
  ║    {{thumbnail}} — album art URL             ║
  ║                                              ║
  ║  LIVE DATA (updated via data-bind):          ║
  ║    data-bind="progress-width"                ║
  ║      → sets style.width to progress%         ║
  ║    data-bind="currentTime"                   ║
  ║      → sets text to "2:05" format            ║
  ║    data-bind="totalTime"                     ║
  ║      → sets text to "4:40" format            ║
  ║    data-bind="progress"                      ║
  ║      → sets text to "45.3" (0-100)           ║
  ║    data-bind="playing"                       ║
  ║      → sets data-playing="true/false"        ║
  ║                                              ║
  ║  CSS VARIABLES (dynamic colors):             ║
  ║    var(--vibrant)                             ║
  ║    var(--lightVibrant)                        ║
  ║    var(--darkVibrant)                         ║
  ║    var(--muted)                               ║
  ║    var(--lightMuted)                          ║
  ║    var(--darkMuted)                           ║
  ║                                              ║
  ║  Font & colors are applied automatically     ║
  ║  via the Editor's color/font picker.         ║
  ╚══════════════════════════════════════════════╝
-->
    </body>
</html>
