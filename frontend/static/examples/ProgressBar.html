<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Custom Player with Progress</title>
        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }
            body {
                font-family: "Rubik", sans-serif;
                background: transparent;
            }
            .player {
                display: flex;
                align-items: center;
                gap: 0.6rem;
                padding: 0.5rem;
                background: var(--darkMuted);
                border: 2px solid var(--vibrant);
                border-radius: 0.5rem;
                width: 22rem;
            }
            .thumbnail {
                width: 3.5rem;
                height: 3.5rem;
                border-radius: 0.35rem;
                object-fit: cover;
                border: 2px solid var(--lightMuted);
                flex-shrink: 0;
            }
            .info {
                flex: 1;
                min-width: 0;
                display: flex;
                flex-direction: column;
                gap: 0.15rem;
            }
            .title {
                font-size: 1rem;
                font-weight: 600;
                color: var(--lightVibrant);
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }
            .artist {
                font-size: 0.75rem;
                color: var(--lightVibrant);
                opacity: 0.6;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }
            .progress-container {
                display: flex;
                align-items: center;
                gap: 0.4rem;
                margin-top: 0.2rem;
            }
            .time {
                font-size: 0.6rem;
                color: var(--lightVibrant);
                opacity: 0.5;
                min-width: 2rem;
            }
            .time.total {
                text-align: right;
            }
            .progress-bar {
                flex: 1;
                height: 3px;
                background: rgba(255, 255, 255, 0.1);
                border-radius: 2px;
                overflow: hidden;
            }
            .progress-fill {
                height: 100%;
                width: 0%;
                background: linear-gradient(
                    90deg,
                    var(--vibrant),
                    var(--lightVibrant)
                );
                border-radius: 2px;
                transition: width 0.5s linear;
            }
        </style>
    </head>
    <body>
        <div class="player">
            <img class="thumbnail" src="{{thumbnail}}" alt="" />
            <div class="info">
                <div class="title">{{title}}</div>
                <div class="artist">{{artist}}</div>
                <div class="progress-container">
                    <span class="time" data-bind="currentTime">0:00</span>
                    <div class="progress-bar">
                        <div
                            class="progress-fill"
                            data-bind="progress-width"
                        ></div>
                    </div>
                    <span class="time total" data-bind="totalTime">0:00</span>
                </div>
            </div>
        </div>
    </body>
</html>
