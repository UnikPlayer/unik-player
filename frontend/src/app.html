<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>UnikPlayer</title>
        <link rel="icon" href="%sveltekit.assets%/favicon.ico" />

        <meta name="viewport" content="width=device-width, initial-scale=1" />

        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400..800;1,400..800&family=JetBrains+Mono:wght@400;500;600;700&family=Old+Standard+TT:ital,wght@0,400;0,700;1,400&family=Rubik:ital,wght@0,300..900;1,300..900&family=Yeseva+One&display=swap"
            rel="stylesheet"
        />

        %sveltekit.head%
    </head>

    <body data-sveltekit-preload-data="hover">
        <div>%sveltekit.body%</div>
    </body>

    <style>
        @font-face {
            font-family: '8bitwonder';
            src: url('/fonts/8bitwonder.otf') format('opentype');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }

        @font-face {
            font-family: "Press Start 2P";
            src: url("/fonts/PressStart2P-Regular.ttf") format("truetype");
            font-weight: 400;
            font-style: normal;
            font-display: swap;
        }

        @font-face {
            font-family: "Keleti";
            src: url("/fonts/Keleti-Regular.ttf") format("truetype");
            font-weight: 400;
            font-style: normal;
            font-display: swap;
        }

        @font-face {
            font-family: "Comfortaa";
            src: url("/fonts/Comfortaa-VariableFont_wght.ttf") format("truetype");
            font-weight: 300 700;
            font-style: normal;
            font-display: swap;
        }

        @font-face {
            font-family: 'minecraft';
            src: url("/fonts/minecraft.ttf") format("truetype");
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }

        @font-face {
            font-family: "Unbounded";
            src: url("/fonts/Unbounded-VariableFont_wght.ttf") format("truetype");
            font-weight: 200 900;
            font-style: normal;
            font-display: swap;
        }

        @font-face {
            font-family: "WDXLLubrifontTC";
            src: url("/fonts/WDXLLubrifontTC-Regular.ttf") format("truetype");
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }

        @font-face {
            font-family: "Roboto Slab";
            src: url("/fonts/RobotoSlab-VariableFont_wght.ttf") format("truetype");
            font-weight: 100 900;
            font-style: normal;
            font-display: swap;
        }

        @font-face {
            font-family: "Yeseva One";
            src: url("/fonts/YesevaOne-Regular.ttf") format("truetype");
            font-weight: 400;
            font-style: normal;
            font-display: swap;
        }

        :root {
            /* === FONTS === */
            --font-ui: '8bitwonder', monospace;
            --font-mono: 'JetBrains Mono', monospace;
            --font-body: 'Rubik', sans-serif;

            /* === Cloud Design System === */
            --c1: #0a0a0a;
            --c2: #ffffff;
            --ca: #ee22cc;
            --c-cloud: #f5f5f5;
            --c-cloud-outline: #0a0a0a;
            --c-cloud-storm: #8c8c9b;
            --c-err: #2d3255;
            --c-err-outline: #0f0f23;
            --c-err-text: #ffffff;
            --c-field: #f5f5f5;
            --c-text: #111111;
            --c-text-muted: rgba(0,0,0,0.25);
            --c-backdrop: rgba(0,0,0,0.65);

            /* === PLAYER COLORS (dynamic, Vibrant.js will override) === */
            --vibrant: #555555;
            --lightVibrant: #cccccc;
            --darkVibrant: #222222;
            --muted: #888888;
            --lightMuted: #aaaaaa;
            --darkMuted: rgba(10, 10, 10, 0.9);
        }

        html,
        body {
            font-family: var(--font-ui);
            color: var(--c-text);
        }

        h2 > * {
            font-size: 2.5rem;
        }
        h3 > * {
            font-size: 2rem;
            font-weight: 400;
        }

        body {
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }
    </style>
</html>
