<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

.player {
  position: relative;
  width: 320px;
  border-radius: 12px;
  overflow: hidden;
  background: var(--darkMuted);
  font-family: "Rubik", sans-serif;
}

.bg-blur {
  position: absolute;
  inset: 0;
  background-image: url("{{thumbnail}}");
  background-size: cover;
  background-position: center;
  filter: blur(20px) brightness(0.4);
  transform: scale(1.1);
  z-index: 0;
}

.content {
  position: relative;
  z-index: 1;
  display: flex;
  flex-direction: column;
  padding: 16px;
}

.top-row {
  display: flex;
  align-items: center;
  gap: 14px;
  margin-bottom: 12px;
}

.cover {
  width: 56px;
  height: 56px;
  border-radius: 8px;
  object-fit: cover;
  flex-shrink: 0;
  border: 2px solid rgba(255,255,255,0.1);
}

.info {
  flex: 1;
  min-width: 0;
}

.title {
  font-size: 1rem;
  font-weight: 600;
  color: var(--lightVibrant);
  white-space: nowrap;
  overflow: hidden;
}

.artist {
  font-size: 0.8rem;
  color: var(--lightVibrant);
  opacity: 0.6;
  white-space: nowrap;
  overflow: hidden;
  margin-top: 2px;
}

.progress-track {
  width: 100%;
  height: 6px;
  background: rgba(255,255,255,0.08);
  border-radius: 3px;
  overflow: hidden;
}

.progress-fill {
  height: 100%;
  width: 0%;
  background: var(--vibrant);
  border-radius: 3px;
  transition: width 0.5s linear;
}
</style>

<div class="player">
  <div class="bg-blur"></div>
  <div class="content">
    <div class="top-row">
      <img class="cover" src="{{thumbnail}}" alt="cover" />
      <div class="info">
        <div class="title">{{title}}</div>
        <div class="artist">{{artist}}</div>
      </div>
    </div>
    <div class="progress-track">
      <div class="progress-fill" data-bind="progress-width"></div>
    </div>
  </div>
</div>
