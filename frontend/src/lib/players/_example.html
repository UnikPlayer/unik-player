<style>
  /* Доступные CSS-переменные (автоматически из обложки): */
  /* var(--vibrant)  var(--lightVibrant)  var(--darkVibrant) */
  /* var(--muted)    var(--lightMuted)    var(--darkMuted)   */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body, html { background: transparent; overflow: hidden; }

  .player {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    padding: 0.6rem 1rem;
    background: var(--darkMuted);
    border: 2px solid var(--vibrant);
    border-radius: 0.5rem;
    width: 18rem;
    font-family: "Rubik", sans-serif;
  }

  .cover {
    width: 3rem; height: 3rem;
    border-radius: 0.35rem;
    object-fit: cover;
    flex-shrink: 0;
  }

  .info { flex: 1; min-width: 0; }

  .title {
    font-size: 0.9rem; font-weight: 600;
    color: var(--lightVibrant);
    white-space: nowrap; overflow: hidden;
  }

  .artist {
    font-size: 0.75rem; color: var(--lightVibrant);
    opacity: 0.65;
    white-space: nowrap; overflow: hidden;
  }
</style>

<div class="player">
  <img class="cover" src="{{thumbnail}}" alt="cover" />
  <div class="info">
    <div class="title">{{title}}</div>
    <div class="artist">{{artist}}</div>
  </div>
</div>
