<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <!-- Шрифт с Google Fonts (единственный разрешённый внешний ресурс) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;600&display=swap" rel="stylesheet" />

  <style>
    /* =====================================================
       БАЗОВЫЕ СТИЛИ — не трогать, нужны для корректного
       отображения в OBS (прозрачный фон, без скролла)
       ===================================================== */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100vh;
      background: transparent;   /* прозрачный фон в OBS */
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* =====================================================
       CSS-ПЕРЕМЕННЫЕ — подставляются автоматически из
       цветов обложки трека (node-vibrant).
       Можно использовать в любом месте стилей.
       ===================================================== */
    :root {
      --vibrant:      #B87333;   /* основной яркий цвет       */
      --lightVibrant: #D4944A;   /* светлый вариант            */
      --darkVibrant:  #5C4033;   /* тёмный вариант             */
      --muted:        #8B6914;   /* приглушённый               */
      --lightMuted:   #C8A86B;   /* светлый приглушённый       */
      --darkMuted:    rgba(20, 15, 10, 0.9); /* тёмный фон    */
    }

    /* =====================================================
       СТИЛИ ПЛЕЕРА — здесь вся визуальная часть
       ===================================================== */
    .player {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0.6rem 1rem;
      background: var(--darkMuted);
      border: 2px solid var(--vibrant);
      border-radius: 0.5rem;
      width: 18rem;
      font-family: 'Rubik', sans-serif;
    }

    .cover {
      width: 3rem;
      height: 3rem;
      border-radius: 0.35rem;
      object-fit: cover;
      flex-shrink: 0;
    }

    .info {
      display: flex;
      flex-direction: column;
      gap: 0.15rem;
      min-width: 0;
      flex: 1;
    }

    .title {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--lightVibrant);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .artist {
      font-size: 0.75rem;
      color: var(--lightVibrant);
      opacity: 0.65;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Прогресс-бар */
    .progress-wrap {
      margin-top: 0.35rem;
      height: 3px;
      background: rgba(255,255,255,0.1);
      border-radius: 2px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: var(--vibrant);
      border-radius: 2px;
      transition: width 0.5s linear;
      width: 0%;   /* обновляется через data-bind */
    }
  </style>
</head>
<body>

  <!-- =====================================================
       РАЗМЕТКА ПЛЕЕРА
       Переменные трека подставляются при загрузке:
         {{title}}      — название трека
         {{artist}}     — имя исполнителя
         {{thumbnail}}  — URL обложки (base64 или http)
         {{currentTime}} — текущее время  "2:34"
         {{totalTime}}   — длительность   "4:12"
         {{progress}}    — прогресс 0-100 (число)
       ===================================================== -->
  <div class="player">

    <!-- Обложка: src заполняется через {{thumbnail}} -->
    <img class="cover" src="{{thumbnail}}" alt="cover" />

    <div class="info">

      <!-- Название трека -->
      <div class="title">{{title}}</div>

      <!-- Исполнитель -->
      <div class="artist">{{artist}}</div>

      <!-- Прогресс-бар:
           data-bind="progress-width" — ширина в % обновляется в реальном времени
           через postMessage от бэкенда (без перезагрузки страницы) -->
      <div class="progress-wrap">
        <div class="progress-fill" data-bind="progress-width"></div>
      </div>

    </div>
  </div>

  <!-- =====================================================
       ЖИВЫЕ ОБНОВЛЕНИЯ — не трогать этот блок.
       Бэкенд шлёт postMessage каждую секунду с данными:
         progress    — 0-100
         currentTime — "2:34"
         totalTime   — "4:12"
         isPlaying   — true/false
         colors      — { vibrant, lightVibrant, ... }
       Элементы с data-bind обновляются автоматически.
       ===================================================== -->
  <script>
    window.addEventListener('message', function(e) {
      if (!e.data || e.data.type !== 'unik-update') return;
      var d = e.data;

      // Обновляем все элементы по data-bind
      document.querySelectorAll('[data-bind]').forEach(function(el) {
        var bind = el.getAttribute('data-bind');
        if      (bind === 'progress-width' && d.progress  !== undefined) el.style.width = d.progress + '%';
        else if (bind === 'currentTime'    && d.currentTime)              el.textContent = d.currentTime;
        else if (bind === 'totalTime'      && d.totalTime)                el.textContent = d.totalTime;
        else if (bind === 'progress'       && d.progress  !== undefined) el.textContent  = d.progress.toFixed(1);
        else if (bind === 'playing')                                       el.setAttribute('data-playing', d.isPlaying ? 'true' : 'false');
      });

      // Обновляем CSS-переменные при смене обложки
      if (d.colors) {
        var r = document.documentElement.style;
        if (d.colors.vibrant)      r.setProperty('--vibrant',      d.colors.vibrant);
        if (d.colors.lightVibrant) r.setProperty('--lightVibrant', d.colors.lightVibrant);
        if (d.colors.darkVibrant)  r.setProperty('--darkVibrant',  d.colors.darkVibrant);
        if (d.colors.muted)        r.setProperty('--muted',        d.colors.muted);
        if (d.colors.lightMuted)   r.setProperty('--lightMuted',   d.colors.lightMuted);
        if (d.colors.darkMuted)    r.setProperty('--darkMuted',    d.colors.darkMuted);
      }

      // Обновляем шрифт если выбран в Editor
      if (d.font) document.body.style.fontFamily = '"' + d.font + '", sans-serif';
    });
  </script>

</body>
</html>
