<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>UnikPlayer Simple Text Example</title>
        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            body {
                font-family: "Rubik", sans-serif;
                background: transparent;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 1rem;
            }

            .player {
                text-align: center;
                padding: 0.8rem 1.2rem;
                background: var(--darkMuted);
                border-radius: 0.5rem;
                border: 2px solid var(--vibrant);
                min-width: 15rem;
            }

            .track-info {
                font-size: 1.1rem;
                font-weight: 600;
                color: var(--lightVibrant);
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }
        </style>
    </head>
    <body>
        <div class="player">
            <div class="track-info">{{title}} - {{artist}}</div>
        </div>

        <!--
  ╔════════════════════════════════════════════╗
  ║  Simple Text Player Example                   ║
  ╠════════════════════════════════════════════╣
  ║                                              ║
  ║  TRACK DATA (replaced once per track):       ║
  ║    {{title}}     — song title                ║
  ║    {{artist}}    — artist name               ║
  ║    {{thumbnail}} — album art URL             ║
  ║                                              ║
  ║  CSS VARIABLES (dynamic colors):             ║
  ║    var(--vibrant)                            ║
  ║    var(--lightVibrant)                       ║
  ║    var(--darkVibrant)                        ║
  ║    var(--muted)                              ║
  ║    var(--lightMuted)                         ║
  ║    var(--darkMuted)                          ║
  ║                                              ║
  ╚════════════════════════════════════════════╝
-->
    </body>
</html>
